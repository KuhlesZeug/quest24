<meta charset="utf-8">
<script>(function(){try{var q=new URLSearchParams(location.search);if(window.top!==window.self||q.get('frame')==='1')return;var a=Math.min(screen.width,screen.height),fine=matchMedia('(pointer:fine)').matches;if(a>=600||fine){location.replace('rahmen.html'+location.search+location.hash)}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quest 24 · Der Hort des Aschenkönigs</title>
<meta name="theme-color" content="#1b1410">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1794260516">
</head>
<body>

<!-- Start -->
<section id="s-start" class="screen on">
  <div class="st-bg"><div class="st-pano"></div><div class="st-front"></div><div class="st-snow"></div></div>
  <div class="st-in">
    <div class="lg"><img class="lg-base" src="a/ui/logo_base.png" alt="Quest 24"><img class="lg-dr" src="a/ui/logo_drache.png" alt=""><i class="lg-glow"></i><img class="lg-fl" src="a/ui/flamme.png" alt=""><div class="lg-smoke"></div></div>
    <div class="st-sub">Der Hort des Aschenkönigs</div>
    <p id="giftline" class="giftline"></p>
    <div class="st-form">
      <div id="codebox" class="field"><label for="code">Zugangscode aus deiner Abenteuerakte</label><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Zugangscode"></div>
      <button id="btn-start" class="pbtn big">Abenteuer beginnen</button>
      <p class="small"><button class="lnk" onclick="openKomplize()">Du verschenkst das Abenteuer? Hier einrichten</button></p>
      <p class="small">Ton an, am schönsten mit Kopfhörern. Dein Spielstand bleibt auf diesem Handy, spiel deshalb immer hier und nicht im privaten Modus.</p>
    </div>
  </div>
</section>

<!-- Film -->
<section id="s-film" class="screen">
  <div class="film" id="film"></div>
  <div class="film-sub" id="film-sub"></div>
  <button class="lnk film-skip" id="btn-skip">Überspringen</button>
</section>

<!-- Charakterbau -->
<section id="s-hero" class="screen"><div class="hero-in" id="hero-in"></div></section>

<!-- Karte -->
<section id="s-map" class="screen">
  <div class="hud" id="hud"></div>
  <div class="map" id="map"><div class="map-in" id="map-in"><img src="a/img/karte.jpg" alt="Landkarte von Eldmark"></div></div>
  <p class="map-foot" id="map-foot"></p>
</section>

<!-- Szene -->
<section id="s-scene" class="screen">
  <div class="sc-bg" id="sc-bg"></div>
  <div class="sc-top"><button class="hb" id="sc-back" aria-label="Zur Karte">'</button><div class="sc-title" id="sc-title"></div></div>
  <div class="sc-box" id="sc-box"><div class="sb-face"></div><div class="sb-main"><div class="sb-name"></div><div class="sb-text"></div></div><div class="sb-more"></div></div>
  <div class="sc-choices" id="sc-choices"></div>
</section>

<div id="battle" class="ovl battle"></div>
<div id="card" class="ovl card"></div>
<div id="sheet" class="ovl sheet"></div>
<div id="toast" class="toast"></div>
